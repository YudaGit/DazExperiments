{% extends "experiment_wrapper.html" %}

{% block title %} Experiment {% endblock %}

{% block extra_head %}
    <script src="{{url_for('static', filename='jspsych/jspsych.js')}}" type="text/javascript"></script>
    <script src="{{url_for('static', filename='jspsych/plugins/jspsych-html-keyboard-response.js')}}" type="text/javascript"></script>
    <script src="{{url_for('static', filename='jspsych/plugins/jspsych-image-keyboard-response.js')}}" type="text/javascript"></script>
    <script src="{{url_for('static', filename='jspsych/plugins/jspsych-fullscreen.js')}}" type="text/javascript"></script>    
    <script src="{{url_for('static', filename='jspsych/plugins/jspsych-survey-multi-choice.js')}}" type="text/javascript"></script>    
    <script src="{{url_for('static', filename='jspsych/plugins/jspsych-survey-text.js')}}" type="text/javascript"></script>    
    <script src="{{url_for('static', filename='jspsych/plugins/jspsych-survey-likert.js')}}" type="text/javascript"></script>    
    <script src="{{url_for('static', filename='jspsych/plugins/jspsych-game-rat-skill.js')}}" type="text/javascript"></script>    
    <script src="{{url_for('static', filename='jspsych/plugins/jspsych-game-rat-skill_v2.js')}}" type="text/javascript"></script>   
	<script src="{{url_for('static', filename='jspsych/plugins/jspsych-external-html.js')}}" type="text/javascript"></script>
    <link rel="stylesheet" href="{{url_for('static', filename='jspsych/css/jspsych.css')}}" type="text/css"></link>
    <link rel="stylesheet" href="{{url_for('static', filename='css/experiment.css')}}" type="text/css"></link>

<link rel="stylesheet" href="https://ajax.googleapis.com/ajax/libs/jqueryui/1.12.1/themes/smoothness/jquery-ui.css">
<script src="https://ajax.googleapis.com/ajax/libs/jqueryui/1.12.1/jquery-ui.min.js"></script>

    <style>
        html{
            overflow-y: hidden;        
        }
        #jspsych-target{
            width: 100%;
            height: 100%;
        }

        .ui-progressbar {
            position: relative;
            z-index: 5000;
        }
        .progress-label {
            position: absolute;
            left: 50%;
            top: 4px;
            font-weight: bold;
            text-shadow: 1px 1px 0 #fff;
        }        
    </style>
{% endblock %}

{% block body %}
    <div id="progressbar"><div class="progress-label">Loading experiment...</div></div>
	<div id="jspsych-target">
    </div>
{% endblock %}

{% block after_body %}

  <script>
    //get data from Python script
    var expt_data = {{data|safe}};

    //some environmental variables
    var theScreen_Width = window.screen.availWidth;
    var theScreen_Height = window.screen.availHeight;

    var rScr_width = window.screen.width;
    var rScr_height = window.screen.height;
    var IMGratio = (theScreen_Height/2.0)/600.0;
    if(IMGratio > 1.0){
        IMGratio = 1.0
    }

    var endStudyTime;


    var add_stimulus_image = function(image_list){
        for (var i = 0; i < image_list.length; i++){
            //var img = new Image();
            //img.src = "{{url_for('static', filename='images/')}}"+image_list[i].token
            //preloadImages.push("{{url_for('static', filename='images/')}}"+image_list[i].token);
            image_list[i]['stim'] = "<img src='"+"{{url_for('static', filename='images/')}}"+image_list[i].token+"' width='"+800*IMGratio+"' height='"+600*IMGratio+"'>",
            image_list[i]['stim_block'] = image_list[i].block;
            image_list[i]['stim_on'] = image_list[i].ON;
        }
    };

    console.log()
    if (expt_data.ExpParameter.StimType == 'image'){
        // preload converter
        add_stimulus_image(expt_data.study_list)
        add_stimulus_image(expt_data.test_list)

    }

    /* Helper functions */
    var add_stimulus_text = function(word_list){
        for (var i = 0; i< word_list.length; i++){
            word_list[i]['stimulus'] = "<p style='font-size:2em;'>" + word_list[i]['token'] + "</p>";
        }
    };

    var set_intrial_items = function(study_list, test_list){
        // intrial: the token was on the study list
        var intrial = {};
        for(var i = 0; i < study_list.length; i++){
            intrial[study_list[i]['token']] = study_list[i];
        }
        for (var i = 0; i < test_list.length; i++){
            test_list[i]['intrial']  = intrial.hasOwnProperty(test_list[i]['token']) ;
        }
    }    

    var send_debrief = function(data){
        if(_record_task_complete){
            //window.location.href ="/debrief";
            var form = document.createElement("form");
            form.setAttribute('method', 'post');
            form.setAttribute('action', '/debrief');

            var input = document.createElement('input');
            input.setAttribute('type', 'hidden');
            input.setAttribute('name', 'data');
            input.setAttribute('value', data);
            form.appendChild(input);


            input = document.createElement('input');
            input.setAttribute('type', 'hidden');
            input.setAttribute('name', 'uid');
            input.setAttribute('value', "{{uid}}");
            form.appendChild(input);

            document.body.appendChild(form);
            form.submit();

        }else{
            window.setTimeout(function(){
                send_debrief(data);
            }, 1000);
        } 
    }
    var check_consent = function(elem) {
        if ($('#consent_checkbox').is(':checked')) {
            return true;
        }
        else {
            alert("If you wish to participate, you must check the box next to the statement 'I agree to participate in this study.'");
            return false;
        }
        return false;
    };
    //########################################################################
    // create timeline 
    //########################################################################
    var timeline = [];

    // #### Quick Blank to collect some information
    var trial = {type: 'html-keyboard-response',
                choices: jsPsych.NO_KEYS,
                stimulus: '<p></p>',
                trial_duration: 100,    
                data: {'part': 'info', 
                       'info.sAvailWidth': theScreen_Width,
                       'info.sAvailHeight': theScreen_Height,
                       'info.sWidth': rScr_width,
                       'info.sHeight': rScr_height,
                       'info.ListLength' : expt_data.ExpParameter.Listlength,
                       'info.Delay' : expt_data.ExpParameter.Delay,
                       'info.StimType' : expt_data.ExpParameter.StimType,
                       'info.StudyTime' : expt_data.ExpParameter.StudyTime,
                       'info.aCoin' : expt_data.ExpParameter.aCoin,
                       'info.OldKey' : expt_data.ExpParameter.OldKey,
                       'info.NewKey' : expt_data.ExpParameter.NewKey,
                       'info.Filler' : expt_data.ExpParameter.Filler,
                       'info.totalRI' : expt_data.ExpParameter.totalRI,
                   },
            };
    timeline.push(trial);


    //########################################################################
    // 0. INSTRUCTIONS 
    //########################################################################
    // (0.1) Plain Language Statement
    var trial = {
        type:'external-html',
        url: "{{url_for('static', filename='html/plain-language-statement.html')}}",
        cont_btn: "next",
        data: {'part': 'statement'}
    };
    timeline.push(trial);




    // (0.2) Consent
    trial = {
        type:'external-html',
        url: "{{url_for('static', filename='html/consent.html')}}",
        cont_btn: "next",
        check_fn: check_consent,
        data: {'part': 'consent'}
    };
    timeline.push(trial);

    // (0.3) Go to fullscreen mode
    timeline.push({
        type: 'fullscreen',
        fullscreen_mode: true,
        message: '<h4>The experiment is about to go into FULLSCREEN mode</h4><div style="width:800px; text-align:left;"><ul> <li> Please ensure that this page is in fullscreen view for the duration of the experiment <li> Mute the volume on your computer <li> Close any pages or apps that may result in popup notifications</ul> Please ensure you will not be distracted for the following 15 minutes!</div>'
    });



    //########################################################################
    // 1. MAIN EXPERIMENT 
    //########################################################################
    // (1.1) STUDY PHASE
    //'study_list':  theList['study'],
    //'ExpParameter': theCOND

        
    // >>>>> STUDY instructions
    trial = {
        type:'external-html',
        url: "{{url_for('static', filename='html/instructions-study.html')}}",
        cont_btn: "read_instructions",
        data: {'part': 'instructions'}
    };
    timeline.push(trial);


    // -- stack trials
    for (var i = 0; i < expt_data.study_list.length;i++){
        if (expt_data.ExpParameter.StimType == 'word'){
            //blank ISI
            var trial = {
                type: 'html-keyboard-response',
                choices: jsPsych.NO_KEYS,
                stimulus: '<p></p>',
                trial_duration: 250,
            };
            timeline.push(trial);
            //stim
            var trial = {
                type: 'html-keyboard-response',
                choices: jsPsych.NO_KEYS,
                //stimulus: expt_data.study_list[i].token,
                stimulus: "<p style='font-size:100pt;'>" + expt_data.study_list[i].token + "</p>",
                trial_duration: expt_data.ExpParameter.StudyTime*1000,
                data: {'block':expt_data.study_list[i].block,
                       'old_new':expt_data.study_list[i].ON,
                       'part': 'study_list',
                       'trial_numb': i,
                   },
            }
            timeline.push(trial);
        } else if (expt_data.ExpParameter.StimType == 'image'){
            //blank ISI
            var trial = {
                type: 'html-keyboard-response',
                choices: jsPsych.NO_KEYS,
                stimulus: '<p></p>',
                trial_duration: 250,
            };
            timeline.push(trial);
            //stim
            var trial = {
                type: 'image-keyboard-response',
                //type: 'html-keyboard-response',
                choices: jsPsych.NO_KEYS,
                //stimulus: "{{url_for('static', filename='images/')}}"+expt_data.study_list[i].token,
                //stimulus: "<img src='"+"{{url_for('static', filename='images/')}}"+expt_data.study_list[i].token+" ' width='"+800*IMGratio+"height='"+600*IMGratio+"'>",
                stimulus: "{{url_for('static', filename='images/')}}"+expt_data.study_list[i].token,
                trial_duration:expt_data.ExpParameter.StudyTime*1000,
                data: {'block':  expt_data.study_list[i].block,
                       'old_new':   expt_data.study_list[i].ON,
                       'part': 'study_list',
                       'trial_numb': i,
                   },                
            }
            timeline.push(trial);
        }
    }


    // (1.3) The Filler/RetentionInterval
    // - we already have instructions in the game 
    //   so we don't need one here.... and to save time...
    if(expt_data.ExpParameter.totalRI != 0.0){
        // card game
        timeline.push({
            type: 'game-rat-skill_v2',
            data: {'part': 'card_game'}, 
            game_duration: expt_data.ExpParameter.totalRI, // total time for the filler

        });
    }


    // (1.4) TEST PHASE
    // Test list instructions.

    // >> flipping instructions  0 -> f is old
    if(expt_data.ExpParameter.aCoin == 0){
        var instruct_key = "<p> If the item is a STUDIED one press <b>" + expt_data.ExpParameter.OldKey  + "</b> <br> and if it is an UNSTUDIED one press <b>" + expt_data.ExpParameter.NewKey  + "</b>.  <br><br>Please response as accurate and fast as you can.</p><br><br><p>Press [SPACE] when you are ready to start.</p></div> ";
        var trial_instruct_key = "<br><br><p><b>" + expt_data.ExpParameter.OldKey  + "</b> if STUDIED &nbsp;&nbsp;&nbsp;&nbsp; <b>" + expt_data.ExpParameter.NewKey  + "</b> if UNSTUDIED.</p>";
    } else{
        var instruct_key = "<p> If the item is an UNSTUDIED one press <b>" + expt_data.ExpParameter.NewKey  + "</b> <br> and if it is a STUDIED one press <b>" + expt_data.ExpParameter.OldKey  + "</b>.  <br><br>Please response as accurate and fast as you can.</p><br><br><p>Press [SPACE] when you are ready to start.</p></div>";
        var trial_instruct_key = "<br><br><p><b>" + expt_data.ExpParameter.NewKey  + "</b> if UNSTUDIED &nbsp;&nbsp;&nbsp;&nbsp; <b>" + expt_data.ExpParameter.OldKey  + "</b> if STUDIED.</p>";
    }
    var trial = {
                type: 'html-keyboard-response',
                choices: ['space'],
                on_start: function(trial) { $( "#jspsych-target" ).focus(); },
                stimulus: "<div>    <h3>Testing</h3> <div class='exp-document-container'> <p>Now you will be tested.   Items will be presented on the screen one at a time. Some of them will be from the stream you just saw (STUDIED), and some will be new ones that you did not see from the previous stream (UNSTUDIED).  Your job is to distinguish the STUDIED ones from the UNSTUDIED ones.</p>",
                prompt: instruct_key,
                // the order of the key should always be f and j since it will be confusing unless
    };

    timeline.push(trial);

        
    //expt_data.test_list
    for (var i = 0; i < expt_data.test_list.length;i++){
        if (expt_data.ExpParameter.StimType == 'word'){
            //blank ISI
            var trial = {
                type: 'html-keyboard-response',
                choices: jsPsych.NO_KEYS,
                stimulus: '<p></p>',
                trial_duration: 250,
            };
            timeline.push(trial);
            //stim
            var trial = {
                type: 'html-keyboard-response',
                choices: ['j', 'f'],
                //stimulus: expt_data.test_list[i].token,
                stimulus: "<p style='font-size:100pt;'>" + expt_data.test_list[i].token + "</p>",
                //trial_duration: expt_data.ExpParameter.StudyTime*1000,
                prompt: trial_instruct_key,
                on_start: function(trial) { $( "#jspsych-target" ).focus(); },
                data: {'block':expt_data.test_list[i].block,
                       'old_new':expt_data.test_list[i].ON,
                       'part': 'test_list',
                       'trial_numb': i,
                       'old_key' : jsPsych.pluginAPI.convertKeyCharacterToKeyCode(expt_data.ExpParameter.OldKey),
                       'new_key' : jsPsych.pluginAPI.convertKeyCharacterToKeyCode(expt_data.ExpParameter.NewKey),
                   },                
            };
            timeline.push(trial);
        } else if (expt_data.ExpParameter.StimType == 'image'){
            //blank ISI
            var trial = {
                type: 'html-keyboard-response',
                choices: jsPsych.NO_KEYS,
                stimulus: '<p></p>',
                trial_duration: 250,
            };
            timeline.push(trial);
            //stim
            var trial = {
                type: 'image-keyboard-response',
                //type: 'html-keyboard-response',
                choices: ['j', 'f'],
                //stimulus: "{{url_for('static', filename='images/')}}"+expt_data.study_list[i].token,
                //stimulus: "<img src='"+"{{url_for('static', filename='images/')}}"+expt_data.test_list[i].token+" ' width='"+800*IMGratio+"height='"+600*IMGratio+"'>",
                //stimulus: expt_data.test_list[i].stim,
                stimulus: "{{url_for('static', filename='images/')}}"+expt_data.test_list[i].token,
                prompt: trial_instruct_key,
                on_start: function(trial) { $( "#jspsych-target" ).focus(); },
                data: {'block': expt_data.test_list[i].block,
                       'old_new':  expt_data.test_list[i].ON,
                       'part': 'test_list',
                       'trial_numb': i,
                       'old_key' : jsPsych.pluginAPI.convertKeyCharacterToKeyCode(expt_data.ExpParameter.OldKey),
                       'new_key' : jsPsych.pluginAPI.convertKeyCharacterToKeyCode(expt_data.ExpParameter.NewKey),
                   },                
            };
            timeline.push(trial);
        };
    }

    // #### Quick Blank
    var trial = {                type: 'html-keyboard-response',                choices: jsPsych.NO_KEYS,                stimulus: '<p></p>',                trial_duration: 500,    };
    timeline.push(trial);

    // #### Quick Blank
    var trial = {type: 'html-keyboard-response',
                choices: ['space'],
                stimulus: '<p>Great job! We just have a couple of questions before you leave. <br><br></p>',
                prompt: '[Press SPACE to continue.]'

            };
    timeline.push(trial);


    // (1.5.) Exit question
    var trial = {
        type: 'survey-text',
        questions: [{prompt: "How old are you? (type in numbers!)", rows:1, columns:10}],
        data: {'part': 'Q.AGE'}
    };
    timeline.push(trial);
    var trial = {   type: 'survey-likert',
                    questions:[{prompt: 'How do you describe yourself?',
                                required: [true],
                                labels: ['Female', 'Male', 'Other']}],
                    data: {'part': 'Q.AGE'}
                } 
    timeline.push(trial);
    var trial = {
        type: 'survey-text',
        questions: [{prompt: "What is your first/native language? (list one unless you are a perfectly balanced-bilingual)<br>", rows:1, columns:10},
                    {prompt: "Do you speak any other language fluently or as a bilingual? Please list all if you do.", rows:2, columns:15}] ,
        data: {'part': 'Q.LANG'}
    };
    timeline.push(trial);

    var trial = {
        type: 'survey-text',
        questions: [{prompt: "Please leave any comments if you had any issues during the experiment. <br>", rows:3, columns:20},
                    ] ,
        data: {'part': 'Q.COMMENT'}
    };
    timeline.push(trial);

    var start_experiment = function(){
        if (! finished_preloading ){
            setTimeout(start_experiment, 1000);
            return false;
        }
        // start the experiment 
        jsPsych.init({
          timeline: timeline,
          display_element: 'jspsych-target',
          on_finish: function() {
            // jsPsych.displayData will print your data on the page.
            // if you want to see it, comment out send_debrief() otherwise 
            // it'll send you through to another page before you have a chance to 
            // look at the data  
            //
            //jsPsych.data.displayData();

            // To save your data you would uncomment the 
            // code below 
            // 
            var all_data = jsPsych.data.get().json();
            _send_task_data(all_data);
            send_debrief(all_data);
          },
          //default_iti: 250
        });

    }
    start_experiment()


  </script>

{% endblock %}

     * @param {Array<number>} colorAngles - Array of color angles from Python (0-359)
     * @returns {Array<Array<number>>} Array of RGB arrays
     */
    function convertColorAnglesToRGB(colorAngles) {
        return colorAngles.map(function(angle) {
            // Round angle to nearest integer and ensure it's in range [0, 359]
            var idx = Math.round(angle) % 360;
            if (idx < 0) idx += 360;
            return highRGBs[idx];
        });
    }
    
    /**
     * Convert Python positions (angles in degrees) to radians for display
     * @param {Array<number>} positions - Array of position angles from Python (0-359)
     * @returns {Array<number>} Array of position angles (same values, just validated)
     */
    function convertPositions(positions) {
        return positions.map(function(pos) {
            // Ensure position is in valid range [0, 360)
            var angle = pos % 360;
            if (angle < 0) angle += 360;
            return angle;
        });
    }

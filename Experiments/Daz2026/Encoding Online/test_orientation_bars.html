<!DOCTYPE html>
<html>
<head>
    <title>Test Orientation Bars - Sub-Experiment 3</title>
    <style>
        body {
            margin: 0;
            padding: 20px;
            background-color: rgb(20, 20, 20);
            color: white;
            font-family: Arial, sans-serif;
        }
        canvas {
            border: 1px solid #444;
            display: block;
            margin: 20px auto;
        }
        .info {
            text-align: center;
            margin: 20px;
        }
        button {
            padding: 10px 20px;
            font-size: 16px;
            margin: 10px;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <div class="info">
        <h1>Sub-Experiment 3: Orientation Bars Test</h1>
        <p>This page tests the orientation bars rendering for Sub-Experiment 3</p>
        <button onclick="testBaseline()">Test Baseline (All Unique)</button>
        <button onclick="testRCue()">Test R-cue (With Redundancy)</button>
        <button onclick="testSetSize4()">Test Set-Size 4</button>
        <button onclick="testSetSize6()">Test Set-Size 6</button>
    </div>
    
    <canvas id="testCanvas"></canvas>
    
    <div class="info" id="info">
        <p>Click a button above to see orientation bars</p>
    </div>

    <script>
        // Color palette (simplified - using first 360 entries from highRGBs)
        // In real implementation, this comes from colorpatches.js
        var highRGBs = [];
        // Generate a simple color wheel for testing
        for (var i = 0; i < 360; i++) {
            var hue = i;
            var r = Math.floor(128 + 127 * Math.cos((hue * Math.PI) / 180));
            var g = Math.floor(128 + 127 * Math.cos((hue * Math.PI) / 180 + 2 * Math.PI / 3));
            var b = Math.floor(128 + 127 * Math.cos((hue * Math.PI) / 180 + 4 * Math.PI / 3));
            highRGBs.push([r, g, b]);
        }

        var canvas = document.getElementById('testCanvas');
        var ctx = canvas.getContext('2d');
        canvas.width = window.innerWidth * 0.9;
        canvas.height = window.innerHeight * 0.7;

        function convertColorAnglesToRGB(colorAngles) {
            return colorAngles.map(function(angle) {
                var idx = Math.round(angle) % 360;
                if (idx < 0) idx += 360;
                return highRGBs[idx];
            });
        }

        function drawOrientationBars(ctx, colors, orientations, positions, setSize) {
            // Clear canvas
            ctx.fillStyle = 'rgb(20, 20, 20)';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            
            var centerX = canvas.width / 2;
            var centerY = canvas.height / 2;
            var patchradius = canvas.height * 0.1;
            var patchRadius = Math.round(window.innerHeight * 0.024);
            
            // Bar length = diameter of color patch
            var barLength = 2 * patchRadius;
            // Bar width = length / 7 (1:7 ratio)
            var barWidth = barLength / 7;
            
            // Draw fixation cross
            ctx.strokeStyle = 'white';
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.moveTo(centerX - 10, centerY);
            ctx.lineTo(centerX + 10, centerY);
            ctx.moveTo(centerX, centerY - 10);
            ctx.lineTo(centerX, centerY + 10);
            ctx.stroke();
            
            // Draw each bar
            for (var ii = 0; ii < setSize; ii++) {
                // Calculate bar center position
                var posAngle = positions[ii] * Math.PI / 180;
                var barCenterX = centerX + patchradius * Math.cos(posAngle);
                var barCenterY = centerY + patchradius * Math.sin(posAngle);
                
                // Get bar color
                var rgbstr = 'rgb(' + colors[ii][0] + ',' + 
                                      colors[ii][1] + ',' + 
                                      colors[ii][2] + ')';
                
                // Get bar orientation (convert to radians, 0-180° -> 0-π)
                var orientationRad = orientations[ii] * Math.PI / 180;
                
                // Save context state
                ctx.save();
                
                // Translate to bar center
                ctx.translate(barCenterX, barCenterY);
                
                // Rotate to bar orientation
                ctx.rotate(orientationRad);
                
                // Draw bar (centered at origin after translation/rotation)
                ctx.fillStyle = rgbstr;
                ctx.strokeStyle = rgbstr;
                ctx.lineWidth = 1;
                ctx.fillRect(-barLength/2, -barWidth/2, barLength, barWidth);
                ctx.strokeRect(-barLength/2, -barWidth/2, barLength, barWidth);
                
                // Restore context state
                ctx.restore();
            }
        }

        function testBaseline() {
            // Baseline: All unique colors and orientations
            var colors = [206, 356, 151, 283];  // Color angles
            var orientations = [32, 49, 107, 170];  // Orientation angles (0-180°)
            var positions = [0, 90, 180, 270];  // Position angles
            
            var rgbColors = convertColorAnglesToRGB(colors);
            
            drawOrientationBars(ctx, rgbColors, orientations, positions, 4);
            
            document.getElementById('info').innerHTML = 
                '<h3>Baseline Trial (Set-Size 4)</h3>' +
                '<p>All unique colors and orientations</p>' +
                '<p>Colors: ' + colors.join(', ') + '°</p>' +
                '<p>Orientations: ' + orientations.join(', ') + '°</p>';
        }

        function testRCue() {
            // R-cue: With redundancy (same color AND orientation)
            var colors = [240, 323, 240, 155, 240, 28];  // Indices 0, 2, 4 are redundant
            var orientations = [73, 19, 73, 165, 73, 152];  // Same pattern
            var positions = [0, 60, 120, 180, 240, 300];  // Evenly spaced
            
            var rgbColors = convertColorAnglesToRGB(colors);
            
            drawOrientationBars(ctx, rgbColors, orientations, positions, 6);
            
            document.getElementById('info').innerHTML = 
                '<h3>R-cue Trial (Set-Size 6)</h3>' +
                '<p>Redundant items (indices 0, 2, 4) have same color AND orientation</p>' +
                '<p>Colors: ' + colors.join(', ') + '°</p>' +
                '<p>Orientations: ' + orientations.join(', ') + '°</p>' +
                '<p>Redundant: Color=' + colors[0] + '°, Orientation=' + orientations[0] + '°</p>';
        }

        function testSetSize4() {
            // Set-size 4 with redundancy
            var colors = [100, 200, 100, 300];  // Indices 0, 2 redundant
            var orientations = [45, 90, 45, 135];  // Same pattern
            var positions = [0, 90, 180, 270];
            
            var rgbColors = convertColorAnglesToRGB(colors);
            
            drawOrientationBars(ctx, rgbColors, orientations, positions, 4);
            
            document.getElementById('info').innerHTML = 
                '<h3>Set-Size 4 Trial</h3>' +
                '<p>Redundant items (indices 0, 2) have same color AND orientation</p>' +
                '<p>Colors: ' + colors.join(', ') + '°</p>' +
                '<p>Orientations: ' + orientations.join(', ') + '°</p>';
        }

        function testSetSize6() {
            // Set-size 6 with redundancy
            var colors = [50, 150, 250, 50, 350, 50];  // Indices 0, 3, 5 redundant
            var orientations = [30, 60, 120, 30, 150, 30];  // Same pattern
            var positions = [0, 60, 120, 180, 240, 300];
            
            var rgbColors = convertColorAnglesToRGB(colors);
            
            drawOrientationBars(ctx, rgbColors, orientations, positions, 6);
            
            document.getElementById('info').innerHTML = 
                '<h3>Set-Size 6 Trial</h3>' +
                '<p>Redundant items (indices 0, 3, 5) have same color AND orientation</p>' +
                '<p>Colors: ' + colors.join(', ') + '°</p>' +
                '<p>Orientations: ' + orientations.join(', ') + '°</p>';
        }

        // Draw initial test
        testBaseline();
    </script>
</body>
</html>
